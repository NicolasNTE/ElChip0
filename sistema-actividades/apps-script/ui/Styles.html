<style>
  :root {
    --tinta: #16203a;
    --tinta-2: #26324f;
    --papel: #f5f6f8;
    --blanco: #ffffff;
    --borde: #e2e5ec;
    --texto: #1c2333;
    --suave: #6b7488;
    --rojo: #c0392b;
    --rojo-fondo: #fdecea;
    --ambar: #b8860b;
    --ambar-fondo: #fff6e0;
    --verde: #1e7e46;
    --verde-fondo: #e7f5ec;
    --morado: #5b3fa0;
    --morado-fondo: #efe9fb;
    --azul: #1a5fb4;
    --azul-fondo: #e5eefb;
    --radio: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--papel);
    color: var(--texto);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* --- Cabecera --- */
  header.barra {
    background: var(--tinta);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header.barra h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .quien { margin-left: auto; font-size: 13px; text-align: right; line-height: 1.3; }
  .quien b { display: block; }
  .quien span { color: #a9b3cc; }

  nav.pestanas { display: flex; gap: 4px; background: var(--tinta-2); padding: 0 12px; overflow-x: auto; }
  nav.pestanas button {
    background: none; border: 0; color: #c3cbe0; padding: 12px 16px;
    font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
    border-bottom: 3px solid transparent;
  }
  nav.pestanas button.activa { color: #fff; border-bottom-color: #7aa2ff; }
  nav.pestanas button:hover { color: #fff; }

  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .vista { display: none; }
  .vista.activa { display: block; }

  h2.titulo { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: var(--suave); margin: 0 0 18px; font-size: 14px; }

  /* --- Tarjetas de indicador --- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .kpi {
    background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio);
    padding: 14px 16px;
  }
  .kpi .n { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .kpi .t { font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: .4px; margin-top: 4px; }
  .kpi.rojo .n { color: var(--rojo); }
  .kpi.ambar .n { color: var(--ambar); }
  .kpi.verde .n { color: var(--verde); }
  .kpi.morado .n { color: var(--morado); }
  .kpi.clicable { cursor: pointer; }
  .kpi.clicable:hover { border-color: var(--tinta); }

  /* --- Bloques --- */
  .bloque {
    background: var(--blanco); border: 1px solid var(--borde);
    border-radius: var(--radio); margin-bottom: 18px; overflow: hidden;
  }
  .bloque > h3 {
    margin: 0; padding: 12px 16px; font-size: 14px; font-weight: 600;
    border-bottom: 1px solid var(--borde); background: #fafbfc;
    display: flex; align-items: center; gap: 8px;
  }
  .bloque > h3 .cuenta {
    background: var(--tinta); color: #fff; border-radius: 20px;
    padding: 1px 9px; font-size: 12px;
  }
  .bloque .cuerpo { padding: 14px 16px; }

  /* --- Filtros --- */
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .filtros select, .filtros input {
    padding: 7px 10px; border: 1px solid var(--borde); border-radius: 8px;
    font-size: 14px; background: var(--blanco); color: var(--texto);
  }
  .filtros input[type=search] { min-width: 200px; }

  /* --- Tabla --- */
  .tabla-envoltura { overflow-x: auto; }
  table.datos { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.datos th {
    text-align: left; padding: 9px 12px; background: #fafbfc; color: var(--suave);
    font-size: 12px; text-transform: uppercase; letter-spacing: .4px;
    border-bottom: 1px solid var(--borde); white-space: nowrap; position: sticky; top: 0;
  }
  table.datos td { padding: 10px 12px; border-bottom: 1px solid #eef0f4; vertical-align: top; }
  table.datos tr:last-child td { border-bottom: 0; }
  table.datos tr.rojo td:first-child { box-shadow: inset 3px 0 0 var(--rojo); }
  table.datos tr.ambar td:first-child { box-shadow: inset 3px 0 0 var(--ambar); }
  table.datos tr.verde td:first-child { box-shadow: inset 3px 0 0 var(--verde); }
  table.datos tr.cerrada { opacity: .55; }
  table.datos td.actividad { min-width: 260px; }
  .meta { color: var(--suave); font-size: 12px; margin-top: 3px; }

  /* --- Etiquetas --- */
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 11.5px; font-weight: 600; margin: 2px 3px 2px 0; white-space: nowrap;
  }
  .tag.rojo { background: var(--rojo-fondo); color: var(--rojo); }
  .tag.ambar { background: var(--ambar-fondo); color: var(--ambar); }
  .tag.verde { background: var(--verde-fondo); color: var(--verde); }
  .tag.morado { background: var(--morado-fondo); color: var(--morado); }
  .tag.azul { background: var(--azul-fondo); color: var(--azul); }
  .tag.gris { background: #eef0f4; color: var(--suave); }

  /* --- Controles en línea --- */
  select.inline, input.inline, textarea.inline {
    border: 1px solid var(--borde); border-radius: 7px; padding: 5px 8px;
    font-size: 13.5px; background: var(--blanco); color: var(--texto); font-family: inherit;
    max-width: 100%;
  }
  select.inline:disabled, input.inline:disabled { background: #f2f3f5; color: var(--suave); }
  textarea.inline { width: 100%; min-height: 54px; resize: vertical; }

  button.btn {
    background: var(--tinta); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.btn:hover { background: var(--tinta-2); }
  button.btn.claro { background: var(--blanco); color: var(--tinta); border: 1px solid var(--borde); }
  button.btn.claro:hover { background: #f0f2f6; }
  button.btn.chico { padding: 5px 10px; font-size: 13px; }
  button.btn:disabled { opacity: .5; cursor: default; }

  /* --- Barra de avance --- */
  .barra-avance { background: #eceff4; border-radius: 20px; height: 9px; overflow: hidden; min-width: 90px; }
  .barra-avance > i { display: block; height: 100%; background: var(--verde); border-radius: 20px; }
  .barra-avance.bajo > i { background: var(--rojo); }
  .barra-avance.medio > i { background: var(--ambar); }

  /* --- Formularios --- */
  .formulario { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .campo { display: flex; flex-direction: column; gap: 5px; }
  .campo label { font-size: 12px; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: .4px; }
  .campo input, .campo select, .campo textarea {
    padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: var(--blanco); color: var(--texto);
  }
  .campo.ancho { grid-column: 1 / -1; }
  /* Lo que tu rol no puede tocar se ve que no se puede tocar. */
  .campo input:disabled, .campo select:disabled, .campo textarea:disabled {
    background: #f2f3f5; color: #8a90a0; cursor: not-allowed;
  }

  /* --- Avisos --- */
  #aviso {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--tinta); color: #fff; padding: 11px 18px; border-radius: 8px;
    font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.22); z-index: 60;
    max-width: 90vw; display: none;
  }
  #aviso.error { background: var(--rojo); }
  #aviso.ok { background: var(--verde); }

  .vacio { color: var(--suave); font-size: 14px; padding: 18px 0; text-align: center; }
  .cargando { color: var(--suave); padding: 30px; text-align: center; }

  .pantalla-error {
    max-width: 520px; margin: 60px auto; background: var(--blanco);
    border: 1px solid var(--borde); border-radius: var(--radio); padding: 28px; text-align: center;
  }
  .pantalla-error h2 { margin: 0 0 8px; font-size: 18px; }
  .pantalla-error p { color: var(--suave); margin: 0; }

  /* --- Detalle --- */
  .detalle { position: fixed; inset: 0; background: rgba(15,20,35,.45); display: none; z-index: 50; }
  .detalle.abierto { display: block; }
  .detalle .panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(520px, 100%);
    background: var(--blanco); overflow-y: auto; padding: 22px;
  }
  .detalle h3 { margin: 0 0 4px; font-size: 17px; }
  .detalle .cerrar { position: absolute; right: 14px; top: 12px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--suave); }
  .historial { font-size: 13px; }
  .historial li { margin-bottom: 8px; list-style: none; padding-left: 12px; border-left: 2px solid var(--borde); }
  .historial ul { padding: 0; }

  @media (max-width: 720px) {
    main { padding: 14px; }
    header.barra { padding: 12px 14px; }
    table.datos th:nth-child(n+5), table.datos td:nth-child(n+5) { display: none; }
    .detalle .panel { width: 100%; }
  }
</style>
