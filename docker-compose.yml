version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: asistencias_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asistencias_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asistencias_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: asistencias_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - asistencias_network

volumes:
  postgres_data:

networks:
  asistencias_network:
    driver: bridge
